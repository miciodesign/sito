<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Outfit, Arial, sans-serif">
<rect width="1200" height="700" fill="#fbfaf7"/>
<text x="60" y="70" font-size="34" font-weight="700" fill="#24201b">Lettiera chiusa: la misura giusta si legge dentro, non fuori</text>
<text x="60" y="104" font-size="20" fill="#6a6359">Lunga almeno una volta e mezza il gatto. Sportello via, coperchio apribile, filtro nuovo ogni 1-2 mesi</text>
<!-- lettiera in sezione -->
<g transform="translate(90,150)">
<rect x="0" y="0" width="640" height="470" rx="14" fill="#ffffff" stroke="#e7e2d9" stroke-width="3"/>
<text x="24" y="40" font-size="18" font-weight="700" fill="#24201b">Sezione di una lettiera chiusa da 66 cm (Savic Nestor Jumbo)</text>
<!-- vaschetta -->
<path d="M90 400 L110 230 L530 230 L550 400 Z" fill="#ffffff" stroke="#24201b" stroke-width="6"/>
<!-- sabbia -->
<path d="M108 400 L120 320 L520 320 L532 400 Z" fill="#f7e8d9"/>
<path d="M120 320 L520 320" stroke="#c2651d" stroke-width="4" stroke-dasharray="10 8"/>
<text x="320" y="370" font-size="15" text-anchor="middle" fill="#c2651d" font-weight="600">sabbia 7-10 cm</text>
<!-- coperchio -->
<path d="M110 230 L130 90 Q320 70 510 90 L530 230" fill="#ffffff" stroke="#24201b" stroke-width="6"/>
<!-- filtro -->
<rect x="270" y="72" width="100" height="18" rx="4" fill="#4e7a66"/>
<text x="320" y="62" font-size="14" text-anchor="middle" fill="#4e7a66" font-weight="600">filtro a carboni, cambio ogni 1-2 mesi</text>
<!-- sportello -->
<rect x="470" y="130" width="60" height="100" rx="6" fill="#f8e3df" stroke="#a53a2a" stroke-width="4" stroke-dasharray="8 6"/>
<text x="500" y="252" font-size="14" fill="#a53a2a" font-weight="600" text-anchor="middle">sportello: parti senza</text>
<!-- gatto -->
<g fill="#c2651d" transform="translate(240,250)"><path d="M0 20 L4 0 L14 10 L26 10 L36 0 L40 20 A20 20 0 1 1 0 20 Z"/><rect x="36" y="22" width="110" height="36" rx="18"/><path d="M146 40 Q190 20 200 50" fill="none" stroke="#c2651d" stroke-width="10" stroke-linecap="round"/></g>
<!-- quote lunghezza interna -->
<line x1="120" y1="430" x2="520" y2="430" stroke="#6a6359" stroke-width="2"/>
<line x1="120" y1="420" x2="120" y2="440" stroke="#6a6359" stroke-width="2"/><line x1="520" y1="420" x2="520" y2="440" stroke="#6a6359" stroke-width="2"/>
<text x="320" y="455" font-size="15" text-anchor="middle" fill="#6a6359">interno 60 cm = 1,5 × un gatto da 40 cm (naso-coda)</text>
<!-- quote altezza -->
<line x1="600" y1="80" x2="600" y2="400" stroke="#6a6359" stroke-width="2"/>
<line x1="590" y1="80" x2="610" y2="80" stroke="#6a6359" stroke-width="2"/><line x1="590" y1="400" x2="610" y2="400" stroke="#6a6359" stroke-width="2"/>
<text x="620" y="245" font-size="15" fill="#6a6359" transform="rotate(90 620 245)" text-anchor="middle">altezza 44-46 cm: il gatto sta in piedi</text>
<!-- esterno -->
<text x="90" y="226" font-size="14" fill="#6a6359">esterno 66 cm</text>
</g>
<!-- confronto a destra -->
<g transform="translate(760,150)">
<rect x="0" y="0" width="350" height="470" rx="14" fill="#ffffff" stroke="#e7e2d9" stroke-width="3"/>
<text x="24" y="40" font-size="18" font-weight="700" fill="#24201b">Esterno → interno</text>
<!-- barra 1 -->
<rect x="24" y="70" width="300" height="34" rx="6" fill="#e7e2d9"/>
<rect x="24" y="70" width="240" height="34" rx="6" fill="#f8e3df" stroke="#a53a2a" stroke-width="3"/>
<text x="34" y="93" font-size="14" fill="#a53a2a" font-weight="600">56 → 50 cm interni: fino a 4,5 kg</text>
<!-- barra 2 -->
<rect x="24" y="120" width="300" height="34" rx="6" fill="#e7e2d9"/>
<rect x="24" y="120" width="260" height="34" rx="6" fill="#fdf3e4" stroke="#c2651d" stroke-width="3"/>
<text x="34" y="143" font-size="14" fill="#c2651d" font-weight="600">57 cm, alta 44: fino a 5-6 kg</text>
<!-- barra 3 -->
<rect x="24" y="170" width="300" height="34" rx="6" fill="#e7e2d9"/>
<rect x="24" y="170" width="300" height="34" rx="6" fill="#e3ede7" stroke="#4e7a66" stroke-width="3"/>
<text x="34" y="193" font-size="14" fill="#4e7a66" font-weight="600">66 → 60 cm interni: tutti i gatti</text>
<text x="24" y="250" font-size="18" font-weight="700" fill="#24201b">Come farla accettare</text>
<g font-size="16" fill="#24201b">
<text x="24" y="285"><tspan font-weight="700" fill="#4e7a66">1</tspan>  Vaschetta sola, stesso posto, stessa sabbia</text>
<text x="24" y="315"><tspan font-weight="700" fill="#4e7a66">2</tspan>  Coperchio dopo 3-4 usi</text>
<text x="24" y="345"><tspan font-weight="700" fill="#4e7a66">3</tspan>  Sportello dopo un'altra settimana, o mai</text>
</g>
<text x="24" y="400" font-size="18" font-weight="700" fill="#24201b">Prezzi ottobre 2026</text>
<text x="24" y="430" font-size="16" fill="#6a6359">da 16 € (Savic Nestor)</text>
<text x="24" y="455" font-size="16" fill="#6a6359">a 90 € (Modkat Flip)</text>
</g>
<text x="60" y="672" font-size="16" fill="#6a6359">miciodesign.it · Il coperchio nasconde l'odore, non lo elimina: due passate di paletta al giorno, sempre.</text>
</svg>
