<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Outfit, Arial, sans-serif">
<rect width="1200" height="700" fill="#fbfaf7"/>
<text x="60" y="70" font-size="34" font-weight="700" fill="#24201b">Togliere i peli di gatto: divano, vestiti, lenzuola</text>
<text x="60" y="104" font-size="20" fill="#6a6359">Il pelo si stacca per attrito e umidità, non si appiccica via: tre strumenti da venti euro e dieci minuti a settimana alla fonte</text>
<!-- tre colonne -->
<g transform="translate(60,140)">
<!-- divano -->
<g>
<rect x="0" y="0" width="340" height="330" rx="16" fill="#ffffff" stroke="#e7e2d9" stroke-width="4"/>
<text x="20" y="36" font-size="20" font-weight="700" fill="#24201b">Divano</text>
<!-- mini divano -->
<g transform="translate(40,60)">
<rect x="0" y="40" width="260" height="70" rx="12" fill="#e7e2d9"/>
<rect x="20" y="10" width="220" height="50" rx="10" fill="#efeae2" stroke="#24201b" stroke-width="4"/>
<rect x="0" y="40" width="34" height="70" rx="8" fill="#efeae2" stroke="#24201b" stroke-width="4"/>
<rect x="226" y="40" width="34" height="70" rx="8" fill="#efeae2" stroke="#24201b" stroke-width="4"/>
<!-- peli -->
<g stroke="#6a6359" stroke-width="1.5" opacity="0.6"><path d="M60 30 q4 -6 8 0"/><path d="M90 24 q4 -6 8 0"/><path d="M140 34 q4 -6 8 0"/><path d="M180 26 q4 -6 8 0"/></g>
<!-- guanto -->
<g transform="translate(100,60)">
<path d="M0 30 L0 8 Q0 0 8 0 L10 0 L10 -14 Q10 -20 16 -20 Q22 -20 22 -14 L22 0 L30 0 L30 -12 Q30 -18 36 -18 Q42 -18 42 -12 L42 0 L50 0 L50 -8 Q50 -14 56 -14 Q62 -14 62 -8 L62 10 L70 2 Q76 -4 80 2 L66 30 Z" fill="#4e7a66" opacity="0.9"/>
</g>
<!-- rotolini -->
<g fill="#6a6359"><ellipse cx="60" cy="88" rx="12" ry="5"/><ellipse cx="200" cy="90" rx="12" ry="5"/></g>
</g>
<g font-size="15" fill="#24201b">
<text x="20" y="206"><tspan fill="#4e7a66" font-weight="700">1</tspan>  Guanto di gomma bagnato, una direzione</text>
<text x="20" y="232"><tspan fill="#4e7a66" font-weight="700">2</tspan>  Spazzola in silicone su cuciture e fessure</text>
<text x="20" y="258"><tspan fill="#4e7a66" font-weight="700">3</tspan>  Rullo riutilizzabile per la finitura</text>
<text x="20" y="284"><tspan fill="#4e7a66" font-weight="700">4</tspan>  Aspirapolvere dopo, non prima</text>
<text x="20" y="312" fill="#c2651d" font-weight="600">Costo: meno di 20 euro, per sempre</text>
</g>
</g>
<!-- vestiti -->
<g transform="translate(370,0)">
<rect x="0" y="0" width="340" height="330" rx="16" fill="#ffffff" stroke="#e7e2d9" stroke-width="4"/>
<text x="20" y="36" font-size="20" font-weight="700" fill="#24201b">Vestiti</text>
<!-- lavatrice e asciugatrice -->
<g transform="translate(40,60)">
<rect x="0" y="0" width="110" height="120" rx="10" fill="#efeae2" stroke="#24201b" stroke-width="4"/>
<circle cx="55" cy="70" r="34" fill="#ffffff" stroke="#24201b" stroke-width="4"/>
<circle cx="55" cy="70" r="22" fill="#e3ebe6"/>
<text x="55" y="20" font-size="12" fill="#6a6359" text-anchor="middle" font-weight="600">asciugatrice</text>
<text x="55" y="140" font-size="12" fill="#4e7a66" text-anchor="middle" font-weight="600">10 min a freddo</text>
<path d="M120 70 L148 70" stroke="#24201b" stroke-width="3"/><path d="M142 64 L150 70 L142 76" stroke="#24201b" stroke-width="3" fill="none"/>
<rect x="156" y="0" width="110" height="120" rx="10" fill="#efeae2" stroke="#24201b" stroke-width="4"/>
<circle cx="211" cy="70" r="34" fill="#ffffff" stroke="#24201b" stroke-width="4"/>
<circle cx="211" cy="70" r="22" fill="#dfe6ee"/>
<circle cx="200" cy="62" r="6" fill="#c2651d"/><circle cx="222" cy="78" r="6" fill="#c2651d"/>
<text x="211" y="20" font-size="12" fill="#6a6359" text-anchor="middle" font-weight="600">lavatrice</text>
<text x="211" y="140" font-size="12" fill="#4e7a66" text-anchor="middle" font-weight="600">palline + risciacquo extra</text>
</g>
<g font-size="15" fill="#24201b">
<text x="20" y="232"><tspan fill="#4e7a66" font-weight="700">Prima</tspan>  asciugatrice a freddo o rullo</text>
<text x="20" y="258"><tspan fill="#4e7a66" font-weight="700">Durante</tspan>  palline antipelo, risciacquo in più</text>
<text x="20" y="284"><tspan fill="#4e7a66" font-weight="700">Dopo</tspan>  di nuovo a freddo, filtro pulito</text>
<text x="20" y="312" fill="#c2651d" font-weight="600">Mai lavare con i peli dentro</text>
</g>
</g>
<!-- lenzuola -->
<g transform="translate(740,0)">
<rect x="0" y="0" width="340" height="330" rx="16" fill="#ffffff" stroke="#e7e2d9" stroke-width="4"/>
<text x="20" y="36" font-size="20" font-weight="700" fill="#24201b">Lenzuola e coperte</text>
<!-- letto -->
<g transform="translate(40,70)">
<rect x="0" y="30" width="260" height="90" rx="10" fill="#efeae2" stroke="#24201b" stroke-width="4"/>
<rect x="0" y="20" width="260" height="30" rx="8" fill="#e3ebe6" stroke="#4e7a66" stroke-width="4"/>
<rect x="14" y="0" width="70" height="26" rx="8" fill="#ffffff" stroke="#24201b" stroke-width="3"/>
<rect x="180" y="40" width="70" height="40" rx="8" fill="#f7e8d9" stroke="#c2651d" stroke-width="3"/>
<g fill="#c2651d" transform="translate(196,46) scale(0.6)"><path d="M0 20 L4 0 L14 10 L26 10 L36 0 L40 20 A20 20 0 1 1 0 20 Z"/></g>
<text x="90" y="40" font-size="12" fill="#4e7a66" font-weight="600" text-anchor="middle">copriletto in microfibra</text>
<text x="215" y="100" font-size="11" fill="#c2651d" font-weight="600" text-anchor="middle">la sua coperta</text>
</g>
<g font-size="15" fill="#24201b">
<text x="20" y="232"><tspan fill="#4e7a66" font-weight="700">Ogni giorno</tspan>  scuoti il copriletto</text>
<text x="20" y="258"><tspan fill="#4e7a66" font-weight="700">Ogni settimana</tspan>  copriletto e coperta in lavatrice</text>
<text x="20" y="284"><tspan fill="#4e7a66" font-weight="700">Sempre</tspan>  strato sacrificale sopra il piumino</text>
<text x="20" y="312" fill="#c2651d" font-weight="600">Il pelo si concentra in un punto</text>
</g>
</g>
</g>
<!-- fonte -->
<g transform="translate(60,500)">
<rect x="0" y="0" width="1080" height="120" rx="14" fill="#e3ebe6"/>
<text x="24" y="34" font-size="18" font-weight="700" fill="#24201b">Alla fonte: la spazzolatura</text>
<g font-size="16" fill="#24201b">
<text x="24" y="66"><tspan fill="#4e7a66" font-weight="700">Pelo corto</tspan>  guanto in silicone o gomma, 1-2 volte a settimana, ogni giorno nelle mute</text>
<text x="24" y="96"><tspan fill="#4e7a66" font-weight="700">Pelo lungo</tspan>  pettine a denti larghi poi cardatore morbido, ogni 2 giorni · <tspan fill="#a53a2a" font-weight="600">pelo a chiazze o pelle arrossata: veterinario</tspan></text>
</g>
</g>
<text x="60" y="672" font-size="16" fill="#6a6359">miciodesign.it · Il guanto di gomma nel cassetto del tavolino, non sotto il lavello.</text>
</svg>
