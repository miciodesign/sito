<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Outfit, Arial, sans-serif">
<rect width="1200" height="700" fill="#fbfaf7"/>
<text x="60" y="70" font-size="34" font-weight="700" fill="#24201b">Protezione per vasistas: quale modello per quale finestra</text>
<text x="60" y="104" font-size="20" fill="#6a6359">Prima misura il cuneo (10-16 cm), l'altezza dell'anta e l'appoggio sul battente</text>
<!-- finestra a vasistas vista di lato/fronte con cuneo -->
<g transform="translate(80,150)">
<!-- telaio fisso -->
<rect x="0" y="0" width="340" height="400" rx="6" fill="#ffffff" stroke="#24201b" stroke-width="7"/>
<!-- anta inclinata (vista frontale: anta ribaltata verso l'interno, il bordo alto si stacca) -->
<polygon points="24,24 316,24 290,60 50,60" fill="#eef4fb" stroke="#24201b" stroke-width="5"/>
<rect x="50" y="60" width="240" height="316" fill="#eef4fb" stroke="#24201b" stroke-width="5"/>
<!-- cunei laterali evidenziati -->
<polygon points="24,24 50,60 50,376 24,376" fill="#f8e3df" stroke="#a53a2a" stroke-width="3"/>
<polygon points="316,24 290,60 290,376 316,376" fill="#f8e3df" stroke="#a53a2a" stroke-width="3"/>
<!-- griglia laterale sinistra (trapezio con sbarre) -->
<g transform="translate(0,0)">
<polygon points="20,70 56,70 56,230 20,230" fill="#ffffff" stroke="#4e7a66" stroke-width="4"/>
<g stroke="#4e7a66" stroke-width="3"><path d="M20 90H56M20 110H56M20 130H56M20 150H56M20 170H56M20 190H56M20 210H56"/></g>
</g>
<!-- griglia laterale destra -->
<g>
<polygon points="284,70 320,70 320,230 284,230" fill="#ffffff" stroke="#4e7a66" stroke-width="4"/>
<g stroke="#4e7a66" stroke-width="3"><path d="M284 90H320M284 110H320M284 130H320M284 150H320M284 170H320M284 190H320M284 210H320"/></g>
</g>
<!-- quota profondità cuneo -->
<g stroke="#c2651d" stroke-width="3" fill="none"><path d="M20 -16 H56"/><path d="M20 -22 V-10 M56 -22 V-10"/></g>
<text x="38" y="-28" font-size="14" fill="#c2651d" font-weight="600" text-anchor="middle">10-16 cm</text>
<!-- quota altezza griglia -->
<g stroke="#c2651d" stroke-width="3" fill="none"><path d="M-22 70 V230"/><path d="M-28 70 H-16 M-28 230 H-16"/></g>
<text x="-34" y="155" font-size="14" fill="#c2651d" font-weight="600" text-anchor="end">62 cm</text>
<!-- gatto che guarda (sagoma ambra sotto il davanzale) -->
<g fill="#c2651d" transform="translate(120,300) scale(0.75)">
<path d="M0 100 C -10 60, 10 40, 40 40 L 34 8 L 58 34 L 86 34 L 110 8 L 104 44 C 130 52, 140 80, 130 100 Z"/>
</g>
<text x="170" y="440" font-size="16" fill="#4e7a66" font-weight="600" text-anchor="middle">due griglie laterali: 8-10 € in tutto</text>
</g>
<!-- schede modelli a destra -->
<g transform="translate(500,150)" font-size="15" fill="#24201b">
<g>
<rect x="0" y="0" width="300" height="118" rx="14" fill="#ffffff" stroke="#e7e2d9" stroke-width="4"/>
<text x="18" y="30" font-size="18" font-weight="700">Griglia laterale</text>
<text x="18" y="54" fill="#6a6359">Trixie, Tiaki · 62 x 8-16 cm</text>
<text x="18" y="76">PVC e alluminio con battente</text>
<text x="18" y="100" fill="#c2651d" font-weight="600">4-5 € l'una · viti o biadesivo</text>
</g>
<g transform="translate(320,0)">
<rect x="0" y="0" width="300" height="118" rx="14" fill="#ffffff" stroke="#e7e2d9" stroke-width="4"/>
<text x="18" y="30" font-size="18" font-weight="700">Griglia superiore</text>
<text x="18" y="54" fill="#6a6359">65 cm, o allungabile 75-125 cm</text>
<text x="18" y="76">solo se la fessura in alto &gt; 5 cm</text>
<text x="18" y="100" fill="#c2651d" font-weight="600">6-12 €</text>
</g>
<g transform="translate(0,140)">
<rect x="0" y="0" width="300" height="118" rx="14" fill="#ffffff" stroke="#e7e2d9" stroke-width="4"/>
<text x="18" y="30" font-size="18" font-weight="700">Pannello trasparente</text>
<text x="18" y="54" fill="#6a6359">plexiglas o policarbonato</text>
<text x="18" y="76">ante a filo, senza battente</text>
<text x="18" y="100" fill="#c2651d" font-weight="600">15-30 € a coppia · incollato</text>
</g>
<g transform="translate(320,140)">
<rect x="0" y="0" width="300" height="118" rx="14" fill="#ffffff" stroke="#e7e2d9" stroke-width="4"/>
<text x="18" y="30" font-size="18" font-weight="700">Rete con telaio</text>
<text x="18" y="54" fill="#6a6359">alluminio, su misura</text>
<text x="18" y="76">per aprire la finestra del tutto</text>
<text x="18" y="100" fill="#c2651d" font-weight="600">25-60 € a finestra</text>
</g>
<g transform="translate(0,280)">
<rect x="0" y="0" width="300" height="118" rx="14" fill="#ffffff" stroke="#e7e2d9" stroke-width="4"/>
<text x="18" y="30" font-size="18" font-weight="700">Limitatore</text>
<text x="18" y="54" fill="#6a6359">apertura ridotta a 3-4 cm</text>
<text x="18" y="76">bagni e finestre di servizio</text>
<text x="18" y="100" fill="#c2651d" font-weight="600">5-15 € · due viti</text>
</g>
<g transform="translate(320,280)">
<rect x="0" y="0" width="300" height="118" rx="14" fill="#f8e3df" stroke="#a53a2a" stroke-width="4"/>
<text x="18" y="30" font-size="18" font-weight="700" fill="#a53a2a">Non funziona</text>
<text x="18" y="54">cuscini nel cuneo, zanzariera a rullo,</text>
<text x="18" y="76">vasi sul davanzale,</text>
<text x="18" y="100">"il mio gatto non lo fa"</text>
</g>
</g>
<text x="600" y="620" font-size="15" fill="#c2651d" font-weight="600" text-anchor="middle">Ogni finestra che resta a vasistas con il gatto solo in casa va protetta; le altre si tengono chiuse</text>
<text x="60" y="672" font-size="16" fill="#6a6359">miciodesign.it · Dopo il montaggio, se nel cuneo passa un pugno chiuso, passa la testa di un gatto.</text>
</svg>
