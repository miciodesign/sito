<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Outfit, Arial, sans-serif">
<rect width="1200" height="700" fill="#fbfaf7"/>
<text x="60" y="70" font-size="34" font-weight="700" fill="#24201b">La giornata di un gatto d'appartamento felice</text>
<text x="60" y="104" font-size="20" fill="#6a6359">Caccia, mangia, si lava, dorme: la sequenza che porta al sonno notturno</text>
<!-- timeline -->
<line x1="100" y1="400" x2="1100" y2="400" stroke="#e7e2d9" stroke-width="8"/>
<g font-size="17" font-weight="600" text-anchor="middle">
<g transform="translate(160,400)"><circle r="34" fill="#f7e8d9" stroke="#c2651d" stroke-width="5"/><text y="7" font-size="22" fill="#c2651d">6</text><text y="80" fill="#24201b">Colazione</text><text y="104" font-size="15" font-weight="400" fill="#6a6359">dal distributore</text></g>
<g transform="translate(360,400)"><circle r="34" fill="#e3ede7" stroke="#4e7a66" stroke-width="5"/><text y="7" font-size="22" fill="#4e7a66">8</text><text y="80" fill="#24201b">10 min di gioco</text><text y="104" font-size="15" font-weight="400" fill="#6a6359">poi puzzle alimentare</text></g>
<g transform="translate(560,400)"><circle r="34" fill="#ffffff" stroke="#24201b" stroke-width="5"/><text y="7" font-size="22" fill="#24201b">13</text><text y="80" fill="#24201b">Pasto</text><text y="104" font-size="15" font-weight="400" fill="#6a6359">distributore, finestra</text></g>
<g transform="translate(760,400)"><circle r="34" fill="#e3ede7" stroke="#4e7a66" stroke-width="5"/><text y="7" font-size="22" fill="#4e7a66">21</text><text y="80" fill="#24201b">15 min di caccia</text><text y="104" font-size="15" font-weight="400" fill="#6a6359">bacchetta, poi cena</text></g>
<g transform="translate(960,400)"><circle r="34" fill="#f7e8d9" stroke="#c2651d" stroke-width="5"/><text y="7" font-size="22" fill="#c2651d">23</text><text y="80" fill="#24201b">Notte</text><text y="104" font-size="15" font-weight="400" fill="#6a6359">acqua, lettiera pulita</text></g>
</g>
<!-- acqua lontana dal cibo -->
<g transform="translate(120,180)">
<rect x="0" y="0" width="440" height="130" rx="14" fill="#ffffff" stroke="#e7e2d9" stroke-width="3"/>
<circle cx="60" cy="65" r="26" fill="none" stroke="#4e7a66" stroke-width="6"/><text x="60" y="118" font-size="14" text-anchor="middle" fill="#4e7a66" font-weight="600">acqua</text>
<line x1="110" y1="65" x2="300" y2="65" stroke="#c2651d" stroke-width="3" stroke-dasharray="8 8"/>
<text x="205" y="50" font-size="16" text-anchor="middle" fill="#c2651d" font-weight="600">almeno 1 metro</text>
<circle cx="350" cy="65" r="26" fill="none" stroke="#24201b" stroke-width="6"/><text x="350" y="118" font-size="14" text-anchor="middle" fill="#24201b" font-weight="600">cibo</text>
</g>
<g transform="translate(640,180)">
<rect x="0" y="0" width="440" height="130" rx="14" fill="#ffffff" stroke="#e7e2d9" stroke-width="3"/>
<text x="24" y="45" font-size="18" font-weight="700" fill="#24201b">Due sessioni di gioco al giorno</text>
<text x="24" y="75" font-size="16" fill="#6a6359">La preda scappa, si nasconde, riparte.</text>
<text x="24" y="100" font-size="16" fill="#6a6359">Alla fine si lascia catturare.</text>
<g fill="#c2651d"><path transform="translate(370,40)" d="M0 20 L4 0 L14 10 L26 10 L36 0 L40 20 A20 20 0 1 1 0 20 Z"/></g>
</g>
<text x="60" y="672" font-size="16" fill="#6a6359">miciodesign.it · Un gatto che cambia abitudini all'improvviso comunica: prima il veterinario.</text>
</svg>
