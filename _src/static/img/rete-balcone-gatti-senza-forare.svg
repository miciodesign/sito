<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Outfit, Arial, sans-serif">
<rect width="1200" height="700" fill="#fbfaf7"/>
<text x="60" y="70" font-size="34" font-weight="700" fill="#24201b">Rete sul balcone senza forare: asta a pressione e morsetto</text>
<text x="60" y="104" font-size="20" fill="#6a6359">L'asta spinge fra pavimento e soffitto, il cavo sta appena dritto, la rete si tende in basso alla ringhiera</text>
<!-- sezione balcone -->
<g transform="translate(80,140)">
<rect x="0" y="0" width="700" height="480" rx="14" fill="#ffffff" stroke="#e7e2d9" stroke-width="3"/>
<text x="24" y="40" font-size="18" font-weight="700" fill="#24201b">Sistema a pressione (serve il soffitto)</text>
<!-- muro casa -->
<rect x="40" y="60" width="30" height="400" fill="#e7e2d9"/>
<!-- soletta sopra -->
<rect x="40" y="60" width="440" height="26" fill="#e7e2d9"/>
<text x="260" y="79" font-size="12" fill="#6a6359" text-anchor="middle">soletta del balcone di sopra: solida</text>
<!-- pavimento -->
<rect x="70" y="420" width="410" height="40" fill="#e7e2d9"/>
<!-- ringhiera -->
<g stroke="#24201b" stroke-width="5"><line x1="455" y1="420" x2="455" y2="300"/><line x1="425" y1="300" x2="480" y2="300"/><line x1="435" y1="420" x2="435" y2="305"/><line x1="475" y1="420" x2="475" y2="305"/></g>
<text x="455" y="440" font-size="13" fill="#6a6359" text-anchor="middle">ringhiera</text>
<!-- asta a pressione -->
<rect x="400" y="86" width="14" height="334" rx="4" fill="#4e7a66"/>
<rect x="392" y="86" width="30" height="10" rx="3" fill="#24201b"/>
<rect x="392" y="410" width="30" height="10" rx="3" fill="#24201b"/>
<rect x="398" y="200" width="18" height="30" rx="3" fill="#24201b" opacity="0.6"/>
<!-- cavo in alto verso il muro -->
<line x1="70" y1="98" x2="407" y2="98" stroke="#4e7a66" stroke-width="3"/>
<circle cx="72" cy="98" r="6" fill="#4e7a66"/>
<!-- rete -->
<rect x="70" y="100" width="337" height="200" fill="#f7e8d9" opacity="0.5"/>
<g stroke="#c2651d" stroke-width="1.2">
<line x1="100" y1="100" x2="100" y2="300"/><line x1="140" y1="100" x2="140" y2="300"/><line x1="180" y1="100" x2="180" y2="300"/><line x1="220" y1="100" x2="220" y2="300"/><line x1="260" y1="100" x2="260" y2="300"/><line x1="300" y1="100" x2="300" y2="300"/><line x1="340" y1="100" x2="340" y2="300"/><line x1="380" y1="100" x2="380" y2="300"/>
<line x1="70" y1="130" x2="407" y2="130"/><line x1="70" y1="160" x2="407" y2="160"/><line x1="70" y1="190" x2="407" y2="190"/><line x1="70" y1="220" x2="407" y2="220"/><line x1="70" y1="250" x2="407" y2="250"/><line x1="70" y1="280" x2="407" y2="280"/>
</g>
<!-- fascette su cavo e asta -->
<g fill="#24201b"><rect x="120" y="94" width="5" height="12"/><rect x="200" y="94" width="5" height="12"/><rect x="280" y="94" width="5" height="12"/><rect x="360" y="94" width="5" height="12"/><rect x="396" y="150" width="22" height="4"/><rect x="396" y="230" width="22" height="4"/></g>
<!-- fascette alla ringhiera -->
<g fill="#24201b"><rect x="428" y="296" width="4" height="12"/><rect x="448" y="296" width="4" height="12"/><rect x="468" y="296" width="4" height="12"/></g>
<line x1="407" y1="300" x2="480" y2="300" stroke="#c2651d" stroke-width="3"/>
<!-- etichette -->
<g font-size="14">
<text x="500" y="100" fill="#4e7a66" font-weight="600">asta ≥ 25 mm, a piombo,</text>
<text x="500" y="118" fill="#4e7a66" font-weight="600">5-10 cm dentro la ringhiera</text>
<text x="500" y="160" fill="#24201b">cavo d'acciaio a 5 cm</text>
<text x="500" y="178" fill="#24201b">dal soffitto, appena teso</text>
<text x="500" y="218" fill="#c2651d" font-weight="600">rete, maglia 3 cm,</text>
<text x="500" y="236" fill="#c2651d" font-weight="600">fascette nere ogni 15-20 cm</text>
<text x="500" y="278" fill="#24201b">in basso: fascette ogni 15 cm</text>
<text x="500" y="296" fill="#24201b">al corrimano, è qui che si tende</text>
<text x="500" y="340" fill="#a53a2a" font-weight="600">✕ cavo tirato a fondo:</text>
<text x="500" y="358" fill="#a53a2a" font-weight="600">piega le aste verso dentro</text>
<text x="500" y="392" fill="#a53a2a" font-weight="600">✕ asta sotto tenda da sole</text>
<text x="500" y="410" fill="#a53a2a" font-weight="600">o controsoffitto leggero</text>
</g>
<!-- gatto -->
<g fill="#c2651d" transform="translate(240,392)"><path d="M0 20 L4 0 L14 10 L26 10 L36 0 L40 20 A20 20 0 1 1 0 20 Z"/><rect x="36" y="22" width="60" height="22" rx="11"/></g>
</g>
<!-- colonna destra: morsetto -->
<g transform="translate(810,140)">
<rect x="0" y="0" width="310" height="480" rx="14" fill="#ffffff" stroke="#e7e2d9" stroke-width="3"/>
<text x="24" y="40" font-size="18" font-weight="700" fill="#24201b">Morsetto (senza soffitto)</text>
<!-- ringhiera -->
<g stroke="#24201b" stroke-width="5"><line x1="80" y1="400" x2="80" y2="300"/><line x1="50" y1="300" x2="230" y2="300"/><line x1="140" y1="400" x2="140" y2="305"/><line x1="200" y1="400" x2="200" y2="305"/></g>
<!-- morsetto -->
<rect x="92" y="286" width="36" height="30" rx="4" fill="none" stroke="#4e7a66" stroke-width="5"/>
<rect x="104" y="316" width="12" height="14" fill="#4e7a66"/>
<!-- asta verticale -->
<rect x="104" y="110" width="12" height="178" rx="3" fill="#4e7a66"/>
<!-- ritorno verso l'interno -->
<path d="M110 110 L50 110" stroke="#4e7a66" stroke-width="10" stroke-linecap="round"/>
<!-- rete -->
<rect x="116" y="116" width="110" height="184" fill="#f7e8d9" opacity="0.5"/>
<g stroke="#c2651d" stroke-width="1.2"><line x1="146" y1="116" x2="146" y2="300"/><line x1="176" y1="116" x2="176" y2="300"/><line x1="206" y1="116" x2="206" y2="300"/><line x1="116" y1="146" x2="226" y2="146"/><line x1="116" y1="176" x2="226" y2="176"/><line x1="116" y1="206" x2="226" y2="206"/><line x1="116" y1="236" x2="226" y2="236"/><line x1="116" y1="266" x2="226" y2="266"/></g>
<!-- rete sul ritorno -->
<rect x="50" y="112" width="60" height="4" fill="#c2651d"/>
<g font-size="13">
<text x="24" y="70" fill="#4e7a66" font-weight="600">ritorno verso l'interno 30-40 cm:</text>
<text x="24" y="86" fill="#4e7a66" font-weight="600">ferma chi si arrampica</text>
<text x="24" y="424" fill="#24201b">un morsetto ogni 1,2-1,5 m,</text>
<text x="24" y="442" fill="#24201b">gomma fra morsetto e metallo</text>
<text x="24" y="468" fill="#6a6359">Per ultimi piani e terrazzi · 3 m: 100-150 €</text>
</g>
</g>
<text x="60" y="672" font-size="16" fill="#6a6359">miciodesign.it · Dopo la prima settimana ristringi le aste: si assestano una volta, poi restano ferme</text>
</svg>
