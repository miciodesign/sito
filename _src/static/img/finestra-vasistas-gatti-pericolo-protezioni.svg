<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Outfit, Arial, sans-serif">
<rect width="1200" height="700" fill="#fbfaf7"/>
<text x="60" y="70" font-size="34" font-weight="700" fill="#24201b">Finestra a vasistas: il cuneo che incastra il gatto</text>
<text x="60" y="104" font-size="20" fill="#6a6359">Larga in alto, stretta in basso: il gatto entra con la testa e scivola fino a bloccarsi con il bacino. Si chiude con una griglia</text>
<!-- SINISTRA: finestra senza protezione, vista laterale -->
<g transform="translate(90,150)">
<text x="0" y="0" font-size="19" font-weight="700" fill="#a53a2a">✕ Senza protezione (vista di lato)</text>
<!-- muro e davanzale -->
<rect x="0" y="20" width="60" height="360" fill="#e7e2d9"/>
<rect x="0" y="380" width="200" height="26" fill="#e7e2d9"/>
<!-- telaio fisso -->
<rect x="60" y="20" width="16" height="360" fill="#24201b"/>
<!-- cuneo fra telaio e anta -->
<path d="M76 20 L76 380 L245 62 Z" fill="#f8e3df"/>
<!-- anta inclinata verso l'interno, cerniera in basso -->
<g transform="translate(68,380) rotate(28)">
<rect x="-8" y="-360" width="16" height="360" fill="#ffffff" stroke="#24201b" stroke-width="5"/>
</g>
<text x="280" y="100" font-size="15" fill="#a53a2a" font-weight="600">cuneo: largo</text>
<text x="280" y="120" font-size="15" fill="#a53a2a" font-weight="600">in alto, stretto</text>
<text x="280" y="140" font-size="15" fill="#a53a2a" font-weight="600">in basso</text>
<!-- gatto incastrato, testa verso il basso -->
<g fill="#a53a2a" transform="translate(98,236) rotate(-62)">
<path d="M0 20 L4 0 L14 10 L26 10 L36 0 L40 20 A20 20 0 1 1 0 20 Z"/>
<rect x="36" y="22" width="86" height="26" rx="13"/>
</g>
<text x="190" y="300" font-size="15" fill="#a53a2a" font-weight="600">bloccato con il bacino</text>
<text x="190" y="322" font-size="14" fill="#6a6359">più si dibatte, più scende</text>
<text x="190" y="344" font-size="14" fill="#6a6359">INTERNO →</text>
<text x="0" y="440" font-size="15" fill="#6a6359">Dopo 30-60 min la circolazione delle</text>
<text x="0" y="462" font-size="15" fill="#6a6359">zampe posteriori è bloccata.</text>
<text x="0" y="486" font-size="15" fill="#a53a2a" font-weight="600">Liberare subito, poi dal veterinario.</text>
</g>
<!-- CENTRO: finestra con griglia, vista frontale -->
<g transform="translate(480,150)">
<text x="0" y="0" font-size="19" font-weight="700" fill="#4e7a66">✓ Griglia laterale + superiore</text>
<rect x="0" y="20" width="300" height="360" fill="#ffffff" stroke="#24201b" stroke-width="8"/>
<path d="M30 50 L270 50 L250 350 L50 350 Z" fill="#eef4fb" stroke="#24201b" stroke-width="5"/>
<rect x="30" y="34" width="240" height="18" fill="#f8e3df"/>
<path d="M8 28 L30 50 L50 350 L8 372 Z" fill="#4e7a66" opacity="0.85"/>
<path d="M292 28 L270 50 L250 350 L292 372 Z" fill="#4e7a66" opacity="0.85"/>
<g stroke="#fbfaf7" stroke-width="2"><line x1="12" y1="80" x2="34" y2="80"/><line x1="14" y1="130" x2="38" y2="130"/><line x1="16" y1="180" x2="41" y2="180"/><line x1="18" y1="230" x2="44" y2="230"/><line x1="20" y1="280" x2="46" y2="280"/><line x1="22" y1="330" x2="48" y2="330"/>
<line x1="266" y1="80" x2="288" y2="80"/><line x1="262" y1="130" x2="286" y2="130"/><line x1="259" y1="180" x2="284" y2="180"/><line x1="256" y1="230" x2="282" y2="230"/><line x1="254" y1="280" x2="280" y2="280"/><line x1="252" y1="330" x2="278" y2="330"/></g>
<rect x="8" y="24" width="284" height="14" fill="#4e7a66"/>
<g fill="#c2651d" transform="translate(120,392)"><path d="M0 20 L4 0 L14 10 L26 10 L36 0 L40 20 A20 20 0 1 1 0 20 Z"/></g>
<text x="150" y="444" font-size="15" fill="#4e7a66" font-weight="600" text-anchor="middle">finestra aperta, gatto dentro</text>
<text x="150" y="466" font-size="14" fill="#6a6359" text-anchor="middle">viti nel telaio o biadesivo (affitto)</text>
<text x="150" y="488" font-size="14" fill="#6a6359" text-anchor="middle">prova del pugno: dove passa, passa la testa</text>
</g>
<!-- DESTRA: alternative -->
<g transform="translate(850,150)" font-size="16" fill="#24201b">
<text x="0" y="0" font-size="19" font-weight="700">Le alternative</text>
<rect x="0" y="20" width="290" height="92" rx="12" fill="#ffffff" stroke="#e7e2d9" stroke-width="4"/>
<text x="16" y="50" font-weight="700">Rete con telaio</text>
<text x="16" y="74" font-size="15" fill="#6a6359">copre tutta la finestra, si apre</text>
<text x="16" y="96" font-size="15" fill="#6a6359">anche a battente · 25-60 €</text>
<rect x="0" y="126" width="290" height="92" rx="12" fill="#ffffff" stroke="#e7e2d9" stroke-width="4"/>
<text x="16" y="156" font-weight="700">Limitatore di apertura</text>
<text x="16" y="180" font-size="15" fill="#6a6359">anta ferma a 3-4 cm: la testa</text>
<text x="16" y="202" font-size="15" fill="#6a6359">non passa · 5-15 € · poca aria</text>
<rect x="0" y="232" width="290" height="92" rx="12" fill="#ffffff" stroke="#e7e2d9" stroke-width="4"/>
<text x="16" y="262" font-weight="700">Fai-da-te</text>
<text x="16" y="286" font-size="15" fill="#6a6359">triangolo di plexiglas o rete</text>
<text x="16" y="308" font-size="15" fill="#6a6359">metallica sul cuneo · 5 €</text>
<rect x="0" y="338" width="290" height="70" rx="12" fill="#f8e3df"/>
<text x="16" y="366" font-weight="700" fill="#a53a2a">✕ Non bastano</text>
<text x="16" y="390" font-size="15" fill="#a53a2a">zanzariera, cuscini nel cuneo, piante</text>
</g>
<text x="60" y="672" font-size="16" fill="#6a6359">miciodesign.it · Capita anche ai gatti che per anni non ci hanno provato. La griglia va messa prima, non dopo.</text>
</svg>
