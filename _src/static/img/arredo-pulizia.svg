<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Outfit, Arial, sans-serif">
<rect width="1200" height="700" fill="#fbfaf7"/>
<text x="60" y="70" font-size="34" font-weight="700" fill="#24201b">Il divano giusto per una casa con gatti</text>
<text x="60" y="104" font-size="20" fill="#6a6359">Conta la trama più del colore: fitta e liscia resiste, ad anelli invita a graffiare</text>
<!-- divano -->
<g transform="translate(90,220)">
<rect x="0" y="80" width="520" height="150" rx="24" fill="#f7e8d9" stroke="#c2651d" stroke-width="5"/>
<rect x="30" y="20" width="460" height="110" rx="24" fill="#f7e8d9" stroke="#c2651d" stroke-width="5"/>
<rect x="-10" y="100" width="60" height="120" rx="20" fill="#f7e8d9" stroke="#c2651d" stroke-width="5"/>
<rect x="470" y="100" width="60" height="120" rx="20" fill="#f7e8d9" stroke="#c2651d" stroke-width="5"/>
<g fill="#c2651d"><path transform="translate(230,40)" d="M0 20 L4 0 L14 10 L26 10 L36 0 L40 20 A20 20 0 1 1 0 20 Z"/></g>
<!-- tiragraffi accanto -->
<rect x="580" y="-40" width="30" height="270" fill="#d8c3a5"/><rect x="545" y="226" width="100" height="18" rx="4" fill="#24201b"/>
<text x="540" y="275" font-size="15" fill="#6a6359">tiragraffi a meno di 1 m</text>
</g>
<g transform="translate(760,180)" font-size="19">
<rect x="0" y="0" width="380" height="200" rx="14" fill="#e3ede7"/>
<text x="24" y="40" font-size="22" font-weight="700" fill="#4e7a66">✓ Resistono</text>
<text x="24" y="80" fill="#24201b">Microfibra e microvelluto</text><text x="24" y="112" fill="#24201b">Pelle e similpelle</text><text x="24" y="144" fill="#24201b">Tela e canvas fitti</text><text x="24" y="176" fill="#24201b">Velluto a pelo corto</text>
<rect x="0" y="230" width="380" height="170" rx="14" fill="#f8e3df"/>
<text x="24" y="270" font-size="22" font-weight="700" fill="#a53a2a">✕ Da evitare</text>
<text x="24" y="310" fill="#24201b">Bouclé, ciniglia, tweed</text><text x="24" y="342" fill="#24201b">Lino e cotone a trama larga</text><text x="24" y="374" fill="#24201b">Tessuti ad anello</text>
</g>
<g transform="translate(90,520)" font-size="17" fill="#6a6359">
<text x="0" y="0" font-weight="700" fill="#24201b">Contro gli odori</text>
<text x="0" y="30">Detergente enzimatico sulla pipì, mai candeggina né ammoniaca.</text>
<text x="0" y="58">Paletta due volte al giorno, vaschetta nuova ogni anno.</text>
</g>
<text x="60" y="672" font-size="16" fill="#6a6359">miciodesign.it · Quindici minuti al giorno, se gli strumenti sono a portata di mano.</text>
</svg>
