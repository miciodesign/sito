<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Outfit, Arial, sans-serif">
<rect width="1200" height="700" fill="#fbfaf7"/>
<text x="60" y="70" font-size="34" font-weight="700" fill="#24201b">Aspirapolvere per peli di gatto: cosa conta davvero</text>
<text x="60" y="104" font-size="20" fill="#6a6359">Non la potenza: il rullo che non si avvolge, il filtro che non risputa, la mini turbospazzola per il divano</text>
<!-- scopa senza filo stilizzata -->
<g transform="translate(120,150)">
<!-- corpo/impugnatura -->
<rect x="150" y="0" width="34" height="70" rx="10" fill="#24201b"/>
<rect x="160" y="60" width="14" height="250" fill="#24201b"/>
<!-- contenitore -->
<rect x="120" y="90" width="94" height="110" rx="18" fill="#ffffff" stroke="#24201b" stroke-width="6"/>
<rect x="132" y="104" width="70" height="82" rx="10" fill="#f7e8d9"/>
<g fill="#c2651d"><circle cx="150" cy="150" r="7"/><circle cx="172" cy="128" r="6"/><circle cx="186" cy="160" r="7"/><circle cx="160" cy="174" r="5"/></g>
<!-- filtro -->
<rect x="124" y="200" width="86" height="22" rx="6" fill="#4e7a66"/>
<text x="240" y="216" font-size="15" fill="#4e7a66" font-weight="600">filtro HEPA lavabile</text>
<!-- tubo e spazzola -->
<rect x="160" y="300" width="14" height="90" fill="#24201b"/>
<rect x="60" y="384" width="220" height="56" rx="16" fill="#ffffff" stroke="#24201b" stroke-width="6"/>
<!-- rullo con pettine -->
<rect x="76" y="398" width="188" height="28" rx="14" fill="#e7e2d9" stroke="#24201b" stroke-width="3"/>
<g stroke="#4e7a66" stroke-width="4"><path d="M90 398V426M110 398V426M130 398V426M150 398V426M170 398V426M190 398V426M210 398V426M230 398V426M250 398V426"/></g>
<text x="170" y="470" font-size="15" fill="#4e7a66" font-weight="600" text-anchor="middle">rullo antigroviglio con pettini</text>
<!-- mini turbospazzola accanto -->
<g transform="translate(330,330)">
<rect x="0" y="0" width="90" height="36" rx="12" fill="#ffffff" stroke="#24201b" stroke-width="5"/>
<rect x="10" y="9" width="70" height="18" rx="9" fill="#e7e2d9" stroke="#24201b" stroke-width="2"/>
<rect x="90" y="10" width="40" height="16" rx="6" fill="#24201b"/>
<text x="45" y="62" font-size="15" fill="#4e7a66" font-weight="600" text-anchor="middle">mini turbospazzola</text>
<text x="45" y="82" font-size="13" fill="#6a6359" text-anchor="middle">divano, cuccia, materasso</text>
</g>
</g>
<!-- divano con gatto e pelo -->
<g transform="translate(560,330)">
<rect x="0" y="40" width="260" height="90" rx="16" fill="#e7e2d9"/>
<rect x="0" y="0" width="260" height="60" rx="16" fill="#d9d2c6"/>
<rect x="-14" y="30" width="28" height="100" rx="12" fill="#d9d2c6"/><rect x="246" y="30" width="28" height="100" rx="12" fill="#d9d2c6"/>
<!-- gatto che dorme -->
<g fill="#c2651d" transform="translate(70,-6)">
<ellipse cx="60" cy="50" rx="62" ry="30"/>
<circle cx="110" cy="36" r="24"/>
<path d="M92 18 L98 -2 L112 14Z"/><path d="M128 18 L122 -2 L108 14Z"/>
<path d="M2 50 C -30 60, -20 90, 10 80" fill="none" stroke="#c2651d" stroke-width="14" stroke-linecap="round"/>
</g>
<!-- peli -->
<g stroke="#c2651d" stroke-width="2" fill="none" stroke-linecap="round"><path d="M20 100 q6 -8 12 0"/><path d="M200 110 q6 -8 12 0"/><path d="M40 118 q6 -8 12 0"/><path d="M230 95 q6 -8 12 0"/><path d="M160 120 q6 -8 12 0"/></g>
<text x="150" y="168" font-size="15" fill="#6a6359" text-anchor="middle">prima il divano, poi il pavimento</text>
</g>
<!-- scheda prezzi -->
<g transform="translate(880,150)" font-size="15" fill="#24201b">
<rect x="0" y="0" width="260" height="440" rx="16" fill="#ffffff" stroke="#e7e2d9" stroke-width="4"/>
<text x="20" y="36" font-size="20" font-weight="700">Per fascia di prezzo</text>
<text x="20" y="74" fill="#4e7a66" font-weight="700">150-250 €</text>
<text x="20" y="96">Samsung Jet 65 Pet,</text><text x="20" y="116">Rowenta X-Force 9.60 Animal,</text><text x="20" y="136">Tineco S15 Pet</text>
<text x="20" y="176" fill="#4e7a66" font-weight="700">250-320 € con filo</text>
<text x="20" y="198">Miele Cat &amp; Dog: tappeti,</text><text x="20" y="218">allergie, case grandi</text>
<text x="20" y="258" fill="#4e7a66" font-weight="700">400-550 €</text>
<text x="20" y="280">Bosch Unlimited 10 ProAnimal,</text><text x="20" y="300">Shark PowerDetect (autosvuotante)</text>
<text x="20" y="340" fill="#4e7a66" font-weight="700">650-900 €</text>
<text x="20" y="362">Dyson V15 Detect, Gen5detect</text>
<rect x="20" y="386" width="220" height="2" fill="#e7e2d9"/>
<text x="20" y="414" fill="#c2651d" font-weight="600">Prezzi indicativi, nov. 2026</text>
</g>
<text x="60" y="672" font-size="16" fill="#6a6359">miciodesign.it · Due minuti di mini turbospazzola sul divano tolgono più pelo di un'ora a terra.</text>
</svg>
