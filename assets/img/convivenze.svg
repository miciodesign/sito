<text x="30" y="100">Erba gatta e graminacee</text><text x="30" y="135">Felce di Boston</text><text x="30" y="170">Calathea e maranta</text><text x="30" y="205">Areca, kentia, chamaedorea</text><text x="30" y="240">Peperomia e pilea</text><text x="30" y="275">Orchidea Phalaenopsis</text><text x="30" y="310">Violetta africana</text><text x="30" y="345">Basilico, rosmarino, timo</text><text x="30" y="380">Bromelie</text><text x="30" y="415">Fragole</text>
