<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Outfit, Arial, sans-serif">
<rect width="1200" height="700" fill="#fbfaf7"/>
<text x="60" y="70" font-size="34" font-weight="700" fill="#24201b">Piante e gatti: quali tenere, quali togliere</text>
<text x="60" y="104" font-size="20" fill="#6a6359">Il giglio è l'unica pianta da non avere mai in casa, nemmeno in un mazzo</text>
