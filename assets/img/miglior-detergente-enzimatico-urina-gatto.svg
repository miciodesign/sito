<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Outfit, Arial, sans-serif">
<rect width="1200" height="700" fill="#fbfaf7"/>
<text x="60" y="70" font-size="34" font-weight="700" fill="#24201b">Detergente enzimatico per urina di gatto: come sceglierlo</text>
<text x="60" y="104" font-size="20" fill="#6a6359">Gli enzimi digeriscono i cristalli di acido urico; la marca conta meno di formato, quantità e tempo di posa</text>
<!-- sezione cuscino -->
<g transform="translate(60,150)">
<text x="0" y="0" font-size="20" font-weight="700" fill="#24201b">Dentro il cuscino</text>
<rect x="0" y="20" width="460" height="60" rx="8" fill="#efeae2" stroke="#24201b" stroke-width="5"/>
<text x="14" y="58" font-size="15" fill="#6a6359">tessuto</text>
<rect x="0" y="80" width="460" height="200" rx="4" fill="#ffffff" stroke="#24201b" stroke-width="5"/>
<text x="14" y="110" font-size="15" fill="#6a6359">imbottitura</text>
<!-- macchia in superficie -->
<ellipse cx="150" cy="50" rx="70" ry="22" fill="#f7e8d9" stroke="#c2651d" stroke-width="4"/>
<!-- cristalli in profondità -->
<g fill="#c2651d">
<circle cx="110" cy="130" r="5"/><circle cx="140" cy="160" r="5"/><circle cx="175" cy="135" r="5"/><circle cx="125" cy="200" r="5"/><circle cx="165" cy="215" r="5"/><circle cx="200" cy="180" r="5"/><circle cx="145" cy="245" r="5"/><circle cx="190" cy="250" r="4"/><circle cx="95" cy="175" r="4"/>
</g>
<text x="150" y="300" font-size="15" fill="#c2651d" font-weight="600" text-anchor="middle">acido urico: cristalli fin qui</text>
<!-- spray superficiale -->
<g transform="translate(300,100)">
<path d="M0 0 L-30 -40" stroke="#a53a2a" stroke-width="4"/>
<ellipse cx="0" cy="10" rx="50" ry="14" fill="none" stroke="#a53a2a" stroke-width="4" stroke-dasharray="7 5"/>
<text x="0" y="48" font-size="14" fill="#a53a2a" font-weight="600" text-anchor="middle">spruzzato: resta in superficie</text>
</g>
<!-- versato -->
<g transform="translate(380,170)">
<path d="M0 -20 L0 100" stroke="#4e7a66" stroke-width="5" stroke-linecap="round"/>
<path d="M-40 100 Q0 130 40 100" fill="none" stroke="#4e7a66" stroke-width="4"/>
<text x="0" y="128" font-size="14" fill="#4e7a66" font-weight="600" text-anchor="middle">versato: arriva ai cristalli</text>
</g>
</g>
<!-- confronto formati -->
<g transform="translate(600,150)">
<text x="0" y="0" font-size="20" font-weight="700" fill="#24201b">Spray pronto o concentrato</text>
<g transform="translate(0,22)">
<rect x="0" y="0" width="260" height="190" rx="14" fill="#ffffff" stroke="#e7e2d9" stroke-width="4"/>
<rect x="30" y="40" width="40" height="110" rx="8" fill="#f7e8d9" stroke="#c2651d" stroke-width="4"/>
<rect x="40" y="22" width="20" height="20" fill="#c2651d"/><path d="M60 28 L80 20" stroke="#c2651d" stroke-width="4"/>
<text x="95" y="48" font-size="17" font-weight="700" fill="#24201b">Spray 500-950 ml</text>
<text x="95" y="74" font-size="15" fill="#6a6359">10-18 € · 15-30 €/litro</text>
<text x="95" y="100" font-size="15" fill="#6a6359">pronto, comodo</text>
<text x="95" y="122" font-size="15" fill="#6a6359">2-3 trattamenti seri</text>
<text x="95" y="160" font-size="15" fill="#c2651d" font-weight="600">un gatto, un incidente</text>
</g>
<g transform="translate(280,22)">
<rect x="0" y="0" width="260" height="190" rx="14" fill="#ffffff" stroke="#e7e2d9" stroke-width="4"/>
<rect x="24" y="30" width="56" height="120" rx="8" fill="#e3ebe6" stroke="#4e7a66" stroke-width="4"/>
<rect x="40" y="18" width="24" height="14" fill="#4e7a66"/>
<text x="95" y="48" font-size="17" font-weight="700" fill="#24201b">Concentrato 1 l</text>
<text x="95" y="74" font-size="15" fill="#6a6359">17-20 € · circa 2 €/litro</text>
<text x="95" y="100" font-size="15" fill="#6a6359">1:10 → 10 l, 1:50 → 50 l</text>
<text x="95" y="122" font-size="15" fill="#6a6359">si versa senza pensarci</text>
<text x="95" y="160" font-size="15" fill="#4e7a66" font-weight="600">più gatti, macchie vecchie</text>
</g>
</g>
<!-- tre regole -->
<g transform="translate(60,490)">
<rect x="0" y="0" width="1100" height="130" rx="14" fill="#e3ebe6"/>
<text x="24" y="36" font-size="18" font-weight="700" fill="#24201b">Le tre regole che valgono per ogni marca</text>
<g font-size="16" fill="#24201b">
<circle cx="40" cy="74" r="14" fill="#4e7a66"/><text x="40" y="79" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><text x="64" y="80">Arrivare dove è arrivata l'urina</text>
<circle cx="400" cy="74" r="14" fill="#4e7a66"/><text x="400" y="79" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><text x="424" y="80">Restare umido per ore, non minuti</text>
<circle cx="760" cy="74" r="14" fill="#4e7a66"/><text x="760" y="79" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><text x="784" y="80">Mai con candeggina, ammoniaca, vapore</text>
<text x="24" y="112" font-size="15" fill="#6a6359">Prezzi indicativi al 9 novembre 2026. Simple Solution, Urine Off, Bactador, Green Hero, Bio-Chem, Dermazoo nell'articolo.</text>
</g>
</g>
<!-- gatto -->
<g fill="#c2651d" transform="translate(1100,60)"><path d="M0 20 L4 0 L14 10 L26 10 L36 0 L40 20 A20 20 0 1 1 0 20 Z"/></g>
<text x="60" y="672" font-size="16" fill="#6a6359">miciodesign.it · Se ha iniziato da poco a sporcare fuori dalla lettiera, prima il veterinario, poi il detergente.</text>
</svg>
