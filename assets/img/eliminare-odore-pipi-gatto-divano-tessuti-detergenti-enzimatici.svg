<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Outfit, Arial, sans-serif">
<rect width="1200" height="700" fill="#fbfaf7"/>
<text x="60" y="70" font-size="34" font-weight="700" fill="#24201b">Odore di pipì di gatto sul divano: perché torna e come si toglie</text>
<text x="60" y="104" font-size="20" fill="#6a6359">I cristalli di acido urico non si sciolgono con l'acqua: li scompongono solo gli enzimi, e vogliono ore</text>
<!-- divano -->
<g transform="translate(70,170)">
<rect x="0" y="120" width="440" height="150" rx="18" fill="#e7e2d9"/>
<rect x="30" y="60" width="380" height="100" rx="16" fill="#efeae2" stroke="#24201b" stroke-width="5"/>
<rect x="0" y="120" width="60" height="150" rx="14" fill="#efeae2" stroke="#24201b" stroke-width="5"/>
<rect x="380" y="120" width="60" height="150" rx="14" fill="#efeae2" stroke="#24201b" stroke-width="5"/>
<rect x="60" y="150" width="160" height="110" rx="10" fill="#efeae2" stroke="#24201b" stroke-width="5"/>
<rect x="220" y="150" width="160" height="110" rx="10" fill="#efeae2" stroke="#24201b" stroke-width="5"/>
<rect x="20" y="270" width="400" height="14" fill="#24201b"/>
<!-- macchia visibile -->
<ellipse cx="140" cy="205" rx="42" ry="26" fill="#f7e8d9" stroke="#c2651d" stroke-width="4"/>
<!-- macchie invisibili (UV) -->
<ellipse cx="300" cy="215" rx="34" ry="20" fill="none" stroke="#4e7a66" stroke-width="4" stroke-dasharray="8 6"/>
<ellipse cx="330" cy="100" rx="26" ry="16" fill="none" stroke="#4e7a66" stroke-width="4" stroke-dasharray="8 6"/>
<!-- sezione cuscino: cristalli in profondità -->
<g stroke="#c2651d" fill="#c2651d">
<circle cx="120" cy="235" r="4"/><circle cx="140" cy="248" r="4"/><circle cx="160" cy="238" r="4"/><circle cx="135" cy="222" r="3"/><circle cx="150" cy="255" r="3"/>
</g>
<text x="140" y="300" font-size="15" fill="#c2651d" font-weight="600" text-anchor="middle">la macchia che vedi</text>
<text x="140" y="320" font-size="14" fill="#c2651d" text-anchor="middle">+ i cristalli in profondità</text>
<text x="330" y="300" font-size="15" fill="#4e7a66" font-weight="600" text-anchor="middle">quelle vecchie: lampada UV</text>
<!-- torcia UV -->
<g transform="translate(400,0)">
<rect x="0" y="0" width="24" height="70" rx="8" fill="#24201b"/>
<path d="M-6 70 L30 70 L24 90 L0 90 Z" fill="#24201b"/>
<path d="M-40 150 L12 95 L64 150 Z" fill="#4e7a66" opacity="0.18"/>
</g>
<!-- gatto -->
<g fill="#c2651d" transform="translate(300,15)"><path d="M0 20 L4 0 L14 10 L26 10 L36 0 L40 20 A20 20 0 1 1 0 20 Z"/><rect x="36" y="22" width="56" height="20" rx="10"/></g>
</g>
<!-- sequenza -->
<g transform="translate(600,150)">
<text x="0" y="0" font-size="20" font-weight="700" fill="#24201b">La sequenza che funziona</text>
<g font-size="17" fill="#24201b">
<g transform="translate(0,30)"><circle cx="16" cy="12" r="16" fill="#4e7a66"/><text x="16" y="18" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><text x="46" y="18">Assorbi: carta, premere, niente acqua calda</text></g>
<g transform="translate(0,78)"><circle cx="16" cy="12" r="16" fill="#4e7a66"/><text x="16" y="18" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><text x="46" y="18">Enzimatico versato, non spruzzato: fin dove è arrivata l'urina</text></g>
<g transform="translate(0,126)"><circle cx="16" cy="12" r="16" fill="#4e7a66"/><text x="16" y="18" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><text x="46" y="18">Lascia agire umido: 15 min se fresca, ore se vecchia</text></g>
<g transform="translate(0,174)"><circle cx="16" cy="12" r="16" fill="#4e7a66"/><text x="16" y="18" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">4</text><text x="46" y="18">Asciuga all'aria 24-48 h, poi ripeti se serve</text></g>
<g transform="translate(0,222)"><circle cx="16" cy="12" r="16" fill="#4e7a66"/><text x="16" y="18" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">5</text><text x="46" y="18">Pulitore a estrazione solo dopo, per risciacquare</text></g>
</g>
<!-- da evitare -->
<rect x="0" y="300" width="540" height="110" rx="12" fill="#f8e3df"/>
<text x="20" y="332" font-size="17" font-weight="700" fill="#a53a2a">✕ Mai, perché fissano o richiamano</text>
<text x="20" y="362" font-size="16" fill="#a53a2a">candeggina · ammoniaca · vapore prima del trattamento</text>
<text x="20" y="390" font-size="16" fill="#a53a2a">profumatori "30 secondi" · ammorbidente sulle fodere</text>
</g>
<!-- timeline fondo -->
<g transform="translate(70,560)">
<line x1="0" y1="20" x2="1060" y2="20" stroke="#e7e2d9" stroke-width="6"/>
<circle cx="0" cy="20" r="9" fill="#c2651d"/><text x="0" y="52" font-size="14" fill="#6a6359">detersivo normale</text>
<circle cx="250" cy="20" r="9" fill="#c2651d"/><text x="250" y="52" font-size="14" fill="#6a6359" text-anchor="middle">2 giorni: sembra sparito</text>
<circle cx="520" cy="20" r="9" fill="#a53a2a"/><text x="520" y="52" font-size="14" fill="#a53a2a" text-anchor="middle" font-weight="600">umidità: l'odore torna</text>
<circle cx="800" cy="20" r="9" fill="#4e7a66"/><text x="800" y="52" font-size="14" fill="#4e7a66" text-anchor="middle" font-weight="600">enzimatico + ore di posa</text>
<circle cx="1060" cy="20" r="9" fill="#4e7a66"/><text x="1060" y="52" font-size="14" fill="#4e7a66" text-anchor="end" font-weight="600">sparito davvero</text>
</g>
<text x="60" y="672" font-size="16" fill="#6a6359">miciodesign.it · Se ha iniziato da poco a sporcare fuori dalla lettiera, prima il veterinario, poi il detergente.</text>
</svg>
