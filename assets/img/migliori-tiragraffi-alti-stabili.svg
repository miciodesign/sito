<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Outfit, Arial, sans-serif">
<rect width="1200" height="700" fill="#fbfaf7"/>
<text x="60" y="70" font-size="34" font-weight="700" fill="#24201b">Tiragraffi alto e stabile: le misure che contano</text>
<text x="60" y="104" font-size="20" fill="#6a6359">Base larga, colonne spesse in sisal, piattaforme da 35-40 cm, cinghia al muro. Se oscilla, il gatto non torna</text>
<g transform="translate(95,41) scale(0.84)">
<!-- pavimento -->
<line x1="60" y1="600" x2="1140" y2="600" stroke="#e7e2d9" stroke-width="8"/>
<!-- muro -->
<line x1="120" y1="130" x2="120" y2="600" stroke="#e7e2d9" stroke-width="8"/>
<!-- tiragraffi giusto -->
<g transform="translate(150,0)">
<rect x="20" y="580" width="260" height="20" rx="4" fill="#24201b"/>
<text x="150" y="630" font-size="15" text-anchor="middle" fill="#24201b" font-weight="600">base 55×45 cm · 15-20 kg</text>
<!-- colonne -->
<rect x="70" y="300" width="40" height="280" fill="#f7e8d9" stroke="#c2651d" stroke-width="5"/>
<rect x="190" y="420" width="40" height="160" fill="#f7e8d9" stroke="#c2651d" stroke-width="5"/>
<g stroke="#c2651d" stroke-width="2"><line x1="70" y1="320" x2="110" y2="320"/><line x1="70" y1="340" x2="110" y2="340"/><line x1="70" y1="360" x2="110" y2="360"/><line x1="70" y1="380" x2="110" y2="380"/><line x1="70" y1="400" x2="110" y2="400"/><line x1="70" y1="420" x2="110" y2="420"/><line x1="70" y1="440" x2="110" y2="440"/><line x1="70" y1="460" x2="110" y2="460"/><line x1="70" y1="480" x2="110" y2="480"/><line x1="70" y1="500" x2="110" y2="500"/><line x1="70" y1="520" x2="110" y2="520"/><line x1="70" y1="540" x2="110" y2="540"/><line x1="70" y1="560" x2="110" y2="560"/><line x1="190" y1="440" x2="230" y2="440"/><line x1="190" y1="460" x2="230" y2="460"/><line x1="190" y1="480" x2="230" y2="480"/><line x1="190" y1="500" x2="230" y2="500"/><line x1="190" y1="520" x2="230" y2="520"/><line x1="190" y1="540" x2="230" y2="540"/><line x1="190" y1="560" x2="230" y2="560"/></g>
<!-- piattaforme -->
<rect x="150" y="400" width="130" height="20" rx="4" fill="#24201b"/>
<rect x="30" y="280" width="130" height="20" rx="4" fill="#24201b"/>
<rect x="110" y="160" width="130" height="20" rx="4" fill="#24201b"/>
<rect x="100" y="140" width="150" height="20" rx="10" fill="#e7e2d9"/>
<!-- gatto in cima -->
<g fill="#c2651d" transform="translate(140,100)"><path d="M0 20 L4 0 L14 10 L26 10 L36 0 L40 20 A20 20 0 1 1 0 20 Z"/><rect x="36" y="22" width="60" height="22" rx="11"/></g>
<!-- cinghia al muro -->
<line x1="110" y1="170" x2="-30" y2="170" stroke="#4e7a66" stroke-width="5"/>
<circle cx="-30" cy="170" r="8" fill="#4e7a66"/>
<text x="-20" y="193" font-size="14" fill="#4e7a66" font-weight="600">cinghia al muro</text>
<!-- quota sisal -->
<line x1="40" y1="300" x2="40" y2="580" stroke="#6a6359" stroke-width="2"/>
<line x1="30" y1="300" x2="50" y2="300" stroke="#6a6359" stroke-width="2"/><line x1="30" y1="580" x2="50" y2="580" stroke="#6a6359" stroke-width="2"/>
<text x="22" y="440" font-size="14" fill="#6a6359" transform="rotate(-90 22 440)" text-anchor="middle">sisal continuo 80-90 cm</text>
<!-- quota altezza -->
<line x1="310" y1="140" x2="310" y2="600" stroke="#6a6359" stroke-width="2"/>
<line x1="300" y1="140" x2="320" y2="140" stroke="#6a6359" stroke-width="2"/>
<text x="330" y="370" font-size="15" fill="#6a6359" transform="rotate(90 330 370)" text-anchor="middle">140-165 cm</text>
<text x="175" y="224" font-size="14" text-anchor="middle" fill="#4e7a66" font-weight="600">piattaforma 35-40 cm</text>
<text x="90" y="275" font-size="13" text-anchor="middle" fill="#6a6359">Ø colonna 9-12 cm</text>
</g>
<!-- tiragraffi sbagliato -->
<g transform="translate(540,0)">
<text x="110" y="300" font-size="18" font-weight="700" fill="#a53a2a" text-anchor="middle">Troppo leggero</text>
<g transform="rotate(8 110 580)">
<rect x="60" y="585" width="100" height="15" rx="4" fill="#a53a2a"/>
<rect x="95" y="360" width="30" height="225" fill="#f8e3df" stroke="#a53a2a" stroke-width="4"/>
<rect x="70" y="345" width="80" height="15" rx="4" fill="#a53a2a"/>
</g>
<text x="110" y="630" font-size="15" text-anchor="middle" fill="#a53a2a" font-weight="600">base 35 cm, 6 kg: oscilla</text>
<text x="110" y="652" font-size="14" text-anchor="middle" fill="#a53a2a">altezza 100 cm, colonna Ø 7</text>
<path d="M30 330 Q110 300 190 330" fill="none" stroke="#a53a2a" stroke-width="3" stroke-dasharray="6 6"/>
</g>
<!-- a pressione -->
<g transform="translate(800,0)">
<text x="130" y="116" font-size="18" font-weight="700" fill="#4e7a66" text-anchor="middle">A pressione pavimento-soffitto</text>
<line x1="60" y1="130" x2="220" y2="130" stroke="#e7e2d9" stroke-width="8"/>
<rect x="125" y="130" width="22" height="470" fill="#e3ede7" stroke="#4e7a66" stroke-width="4"/>
<rect x="100" y="590" width="72" height="12" rx="3" fill="#4e7a66"/>
<rect x="100" y="130" width="72" height="12" rx="3" fill="#4e7a66"/>
<rect x="60" y="480" width="90" height="14" rx="4" fill="#24201b"/>
<rect x="125" y="380" width="90" height="14" rx="4" fill="#24201b"/>
<rect x="60" y="280" width="90" height="14" rx="4" fill="#24201b"/>
<rect x="125" y="200" width="90" height="14" rx="4" fill="#24201b"/>
<text x="130" y="630" font-size="15" text-anchor="middle" fill="#4e7a66" font-weight="600">zero buchi, zero oscillazione</text>
<text x="130" y="652" font-size="14" text-anchor="middle" fill="#6a6359">serve un soffitto solido · 80-200 €</text>
<g fill="#c2651d" transform="translate(135,160)"><path d="M0 20 L4 0 L14 10 L26 10 L36 0 L40 20 A20 20 0 1 1 0 20 Z"/></g>
</g>
</g>
<text x="60" y="672" font-size="16" fill="#6a6359">miciodesign.it · Prezzi ottobre 2026: da 60 € (Feandrea 143 cm) a 170 € (Natural Paradise XXL). Sotto i 50 € sono per gattini.</text>
</svg>
