<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Outfit, Arial, sans-serif">
<rect width="1200" height="700" fill="#fbfaf7"/>
<text x="60" y="70" font-size="34" font-weight="700" fill="#24201b">Il gatto graffia il divano: cosa fare davvero</text>
<text x="60" y="104" font-size="20" fill="#6a6359">Un'alternativa migliore a meno di un metro, il divano reso poco interessante per qualche settimana, un premio ogni volta</text>
<!-- pavimento -->
<rect x="60" y="560" width="600" height="12" fill="#24201b"/>
<!-- divano -->
<g transform="translate(240,300)">
<rect x="0" y="130" width="380" height="130" rx="16" fill="#e7e2d9"/>
<rect x="24" y="60" width="332" height="100" rx="14" fill="#efeae2" stroke="#24201b" stroke-width="5"/>
<rect x="0" y="120" width="54" height="140" rx="12" fill="#efeae2" stroke="#24201b" stroke-width="5"/>
<rect x="326" y="120" width="54" height="140" rx="12" fill="#efeae2" stroke="#24201b" stroke-width="5"/>
<rect x="54" y="150" width="136" height="100" rx="10" fill="#efeae2" stroke="#24201b" stroke-width="5"/>
<rect x="190" y="150" width="136" height="100" rx="10" fill="#efeae2" stroke="#24201b" stroke-width="5"/>
<!-- graffi sul bracciolo -->
<g stroke="#a53a2a" stroke-width="3" stroke-linecap="round"><line x1="12" y1="150" x2="18" y2="200"/><line x1="22" y1="146" x2="28" y2="196"/><line x1="32" y1="150" x2="38" y2="200"/></g>
<!-- nastro sul bracciolo -->
<rect x="4" y="124" width="46" height="60" rx="6" fill="#ffffff" opacity="0.7" stroke="#6a6359" stroke-width="2" stroke-dasharray="4 3"/>
<text x="27" y="30" font-size="14" fill="#a53a2a" font-weight="600" text-anchor="middle">nastro biadesivo</text>
<text x="27" y="48" font-size="14" fill="#a53a2a" font-weight="600" text-anchor="middle">per qualche settimana</text>
<path d="M27 56 L27 118" stroke="#a53a2a" stroke-width="2" stroke-dasharray="4 3"/>
</g>
<!-- tiragraffi accanto -->
<g transform="translate(90,220)">
<rect x="0" y="330" width="120" height="14" rx="4" fill="#24201b"/>
<rect x="46" y="60" width="28" height="270" fill="#f7e8d9" stroke="#c2651d" stroke-width="4"/>
<g stroke="#c2651d" stroke-width="2" opacity="0.6"><line x1="46" y1="90" x2="74" y2="90"/><line x1="46" y1="130" x2="74" y2="130"/><line x1="46" y1="170" x2="74" y2="170"/><line x1="46" y1="210" x2="74" y2="210"/><line x1="46" y1="250" x2="74" y2="250"/><line x1="46" y1="290" x2="74" y2="290"/></g>
<rect x="20" y="48" width="80" height="14" rx="4" fill="#24201b"/>
<!-- gatto che graffia in alto -->
<g fill="#c2651d"><path transform="translate(2,72)" d="M0 20 L4 0 L14 10 L26 10 L36 0 L40 20 A20 20 0 1 1 0 20 Z"/><rect x="12" y="106" width="22" height="100" rx="11"/><rect x="30" y="112" width="18" height="10" rx="5"/><rect x="30" y="150" width="18" height="10" rx="5"/></g>
<text x="60" y="30" font-size="15" fill="#4e7a66" font-weight="600" text-anchor="middle">sisal, ≥ 90 cm, stabile</text>
</g>
<!-- misura distanza -->
<g stroke="#4e7a66" stroke-width="3">
<line x1="210" y1="600" x2="300" y2="600"/><line x1="210" y1="592" x2="210" y2="608"/><line x1="300" y1="592" x2="300" y2="608"/>
</g>
<text x="255" y="628" font-size="14" fill="#4e7a66" font-weight="600" text-anchor="middle">&lt; 1 metro</text>
<!-- tavola orizzontale -->
<g transform="translate(560,520)">
<path d="M0 40 L110 10 L110 26 L0 56 Z" fill="#f7e8d9" stroke="#c2651d" stroke-width="4"/>
<text x="55" y="80" font-size="14" fill="#c2651d" font-weight="600" text-anchor="middle">tavola in cartone</text>
</g>
<!-- passi -->
<g transform="translate(700,150)">
<text x="0" y="0" font-size="20" font-weight="700" fill="#24201b">Sei passi, due-quattro settimane</text>
<g font-size="16" fill="#24201b">
<g transform="translate(0,26)"><circle cx="14" cy="10" r="14" fill="#4e7a66"/><text x="14" y="15" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><text x="40" y="15">Guarda come graffia: in verticale o a terra</text></g>
<g transform="translate(0,66)"><circle cx="14" cy="10" r="14" fill="#4e7a66"/><text x="14" y="15" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><text x="40" y="15">Tiragraffi alto, in sisal, con base pesante</text></g>
<g transform="translate(0,106)"><circle cx="14" cy="10" r="14" fill="#4e7a66"/><text x="14" y="15" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><text x="40" y="15">Accanto al punto graffiato, non in un angolo</text></g>
<g transform="translate(0,146)"><circle cx="14" cy="10" r="14" fill="#4e7a66"/><text x="14" y="15" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">4</text><text x="40" y="15">Divano sgradevole: nastro, plastica, copridivano fitto</text></g>
<g transform="translate(0,186)"><circle cx="14" cy="10" r="14" fill="#4e7a66"/><text x="14" y="15" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">5</text><text x="40" y="15">Catnip sul tiragraffi e premio entro due secondi</text></g>
<g transform="translate(0,226)"><circle cx="14" cy="10" r="14" fill="#4e7a66"/><text x="14" y="15" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">6</text><text x="40" y="15">Se lo cogli sul divano: interrompi, accompagna, premia</text></g>
</g>
<rect x="0" y="290" width="440" height="100" rx="12" fill="#f8e3df"/>
<text x="20" y="322" font-size="17" font-weight="700" fill="#a53a2a">✕ Non servono o peggiorano</text>
<text x="20" y="348" font-size="15" fill="#a53a2a">urla, spruzzi d'acqua, punizioni · spray repellenti</text>
<text x="20" y="372" font-size="15" fill="#a53a2a">coperte morbide sul divano · tiragraffi che oscilla</text>
<rect x="0" y="410" width="440" height="60" rx="12" fill="#e3ebe6"/>
<text x="20" y="436" font-size="15" fill="#24201b" font-weight="600">Unghie: taglia la punta ogni 2-3 settimane.</text>
<text x="20" y="458" font-size="15" fill="#24201b">Onicectomia: vietata in Italia, è una mutilazione.</text>
</g>
<text x="60" y="672" font-size="16" fill="#6a6359">miciodesign.it · Non si decide se il gatto graffia. Si decide dove.</text>
</svg>
